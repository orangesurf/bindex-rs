[package]
name = "bindex-electrum"
version = "0.1.0"
edition = "2021"
description = "Electrum protocol server backed by bindex"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
bindex = { path = "../bindex-lib", features = ["bitcoin_serde"] }
bitcoin = { version = "0.32", default-features = false, features = ["serde"] }
clap = { version = "4", features = ["derive", "string"] }
elements = { version = "0.26", optional = true, default-features = false, features = ["serde"] }
env_logger = "0.11"
hex = "0.4"
log = "0.4"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
ureq = { version = "3", default-features = false, features = ["json"] }
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

[features]
# ureq/rustls: the Liquid REST API proxies the asset routes to an HTTPS upstream
liquid = ["bindex/liquid", "dep:elements", "ureq/rustls"]

[dev-dependencies]
corepc-node = { version = "0.12", default-features = false, features = ["30_0"] }
tempfile = "3"
