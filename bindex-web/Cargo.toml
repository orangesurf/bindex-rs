[package]
name = "bindex-web"
version = "0.1.0"
edition = "2021"
description = "Tiny web UI for address / txid search over a bindex index"
license = "MIT"

[dependencies]
bindex = { path = "../bindex-lib", features = ["cache"] }
tiny_http = "0.12"
rusqlite = "0.37"
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
